name: Build apps
on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name chess_game --org com.example .
      - name: Android manifest tweaks (internet, label, AdMob app id)
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"',1)
          s=re.sub(r'android:label="[^"]*"','android:label="Chess"',s,count=1)
          s=s.replace('</application>','<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7019939648590037~6451390449"/>\n    </application>',1)
          open(p,'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios --project-name chess_game --org com.example .
      - name: iOS app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Chess" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~1458002511" ios/Runner/Info.plist || true
      - run: flutter pub get
      - name: Generate Podfile
        run: flutter build ios --config-only --release --no-codesign || true
      - name: Prepare CocoaPods (explicit iOS version + fresh specs)
        run: |
          cd ios
          ls
          sed -i '' -e "s/^# platform :ios.*/platform :ios, '15.0'/" -e "s/^platform :ios.*/platform :ios, '15.0'/" Podfile
          pod repo update
          pod install
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr chess.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: chess-ipa
          path: chess.ipa
