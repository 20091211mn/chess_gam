name: Build apps
on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name chess_game --org com.example .
      - name: Android manifest tweaks (internet + label)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Chess"#' $M
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7019939648590037~6451390449"/>\n    </application>#' $M
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios --project-name chess_game --org com.example .
      - name: iOS app name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Chess" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~1458002511" ios/Runner/Info.plist || true
      - run: flutter pub get
      - name: Prepare CocoaPods (explicit iOS version + fresh specs)
        run: |
          cd ios
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" Podfile || true
          pod install --repo-update
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr chess.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: chess-ipa
          path: chess.ipa
