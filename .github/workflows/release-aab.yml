name: Release AAB (Google Play)
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check upload key secrets
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Missing secrets::Add UPLOAD_KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see PUBLISHING_CHECKLIST.md step 4)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Firebase config (from google-services.json)
        run: python3 .github/gen_firebase.py android
      - run: flutter create --platforms=android --project-name chess_game --org com.shatranj .
      - name: Android manifest (internet, ads id, label)
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application',1)
          s=re.sub(r'android:label="[^"]*"','android:label="Chess"',s,count=1)
          s=s.replace('</application>','<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7019939648590037~6451390449"/>\n        <meta-data android:name="com.google.android.gms.ads.flag.OPTIMIZE_INITIALIZATION" android:value="true"/>\n        <meta-data android:name="com.google.android.gms.ads.flag.OPTIMIZE_AD_LOADING" android:value="true"/>\n    </application>',1)
          open(p,'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
          grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - name: Disable R8 minify and sign with the upload key
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > android/app/upload.jks
          python3 - <<'PY'
          import os,re
          kts='android/app/build.gradle.kts'
          grv='android/app/build.gradle'
          if os.path.exists(kts):
              p=kts
              s=open(p).read()
              s=re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            isMinifyEnabled = false\n            isShrinkResources = false', s, count=1)
              s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
              block='    signingConfigs {\n        create("release") {\n            storeFile = file("upload.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n'
          else:
              p=grv
              s=open(p).read()
              s=re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            minifyEnabled false\n            shrinkResources false', s, count=1)
              s=s.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.release')
              block='    signingConfigs {\n        release {\n            storeFile file("upload.jks")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n'
          n=re.sub(r'(android\s*\{\n)', lambda m: m.group(1)+block, s, count=1)
          print('SIGNING PATCHED' if (n!=s and 'upload.jks' in n and 'getByName("release")' in n or 'signingConfigs.release' in n) else 'SIGNING NOT PATCHED')
          open(p,'w').write(n)
          print(n)
          PY
      - run: flutter pub get
      - name: Check our code (lib only)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter build appbundle --release --no-shrink --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: chess-aab
          path: build/app/outputs/bundle/release/app-release.aab
